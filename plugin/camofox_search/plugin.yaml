name: web-camofox-search
version: 0.2.0
description: "Web search and page extraction through a self-hosted Camofox anti-detection browser (Camoufox engine). Search/content rules live in a SQLite database (HERMES_HOME/camofox-search/camofox-search.db, WAL) and are managed by the bundled camofox-search-manage tool and camofox-search-rule skill. Requires a running camofox-browser server (CAMOFOX_URL, CAMOFOX_API_KEY)."
author: chaorenex1
license: MIT
kind: backend
provides_web_providers:
  - camofox-search
provides_tools:
  - camofox-search-manage
requires_env:
  - CAMOFOX_URL
  - CAMOFOX_API_KEY
