[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-camofox-search"
version = "0.6.0"
description = "Hermes web-search provider backed by a self-hosted Camofox anti-detection browser"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]
# App-Bound (v20) Chromium cookie export (modern Edge/Chrome on Windows).
abe = [
    "rookie-cookies>=0.6",
]

# Pip distribution path for the same plugin the copy installer deploys.
# The entry point name matches the plugin manifest name so both install
# routes share one identity.
[project.entry-points."hermes_agent.plugins"]
web-camofox-search = "plugin.camofox_search"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["plugin.camofox_search*"]
namespaces = true

[tool.setuptools.package-data]
"plugin.camofox_search" = [
    "plugin.yaml",
]

[tool.setuptools.exclude-package-data]
"plugin.camofox_search" = ["__pycache__/*", "*.py[cod]"]
